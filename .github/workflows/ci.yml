name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck # next build skips *.test.ts
      - run: npm run validate-data -- --schema
      - run: npm run build
